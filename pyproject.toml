[project]
name = "democraft-mcp"
version = "0.2.0b1"
description = "Demo fleet for the ArtCraft family: one page per Craft app, every demo a real headless CLI/MCP run with an AI flow."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "prefab-ui>=0.14.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.16", "pyright>=1.1"]

[dependency-sources]
# local only - PyPI defaults apply

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/democraft_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["T20"]
"tests/*.py" = ["T20"]

[tool.coverage.run]
source = ["democraft_mcp"]

[tool.coverage.report]
fail_under = 55
show_missing = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Coverage gate (M3): fail_under mirrors [tool.coverage.report] so `just ci` enforces it.
addopts = ["--cov=democraft_mcp", "--cov-fail-under=55", "--cov-report=term-missing"]
